name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

concurrency:
  group: tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Check format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9
        with:
          version: "latest"
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --group dev

      # `./src ./tests` - both. Pointing ruff at `./src` alone meant the test
      # suite was linted and formatted by nothing, and it had accumulated
      # unused imports, unused variables, `type(x) == y` comparisons and two
      # files the formatter would have rewritten.
      - name: Run ruff checks
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4
        with:
          src: "./src ./tests"
          version-file: "uv.lock"

      - name: Run ruff format checks
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4
        with:
          src: "./src ./tests"
          version-file: "uv.lock"
          args: "format --check --diff"

  mypy:
    name: Check mypy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9
        with:
          version: "latest"
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run mypy checks
        run: uv run mypy --explicit-package-bases src/

      - name: Run mypy checks
        run: uv run mypy --explicit-package-bases tests/

  pyright:
    name: Check pyright
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9
        with:
          version: "latest"
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run pyright checks
        run: uv run pyright src/

  package:
    name: Check packaging (py.typed)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9
        with:
          version: "latest"
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      # `uv sync` resolves and installs without complaining that the lockfile
      # disagrees with pyproject.toml, so a dependency change that skipped
      # `uv lock` went green everywhere and only surfaced at release time, when
      # the release PR refreshes the lock and picks up someone else's edit.
      - name: Assert uv.lock is up to date with pyproject.toml
        run: uv lock --check

      - name: Build wheel
        run: uv build --wheel

      - name: Assert py.typed ships in the wheel (PEP 561)
        run: |
          wheel=$(ls dist/*.whl)
          echo "Inspecting $wheel"
          if unzip -l "$wheel" | grep -q 'surrealdb/py.typed'; then
            echo "OK: surrealdb/py.typed is present in the wheel"
          else
            echo "ERROR: surrealdb/py.typed is missing from the wheel; PEP 561 type information would not ship to users"
            unzip -l "$wheel"
            exit 1
          fi

      # The embedded package ships hand-written stubs (_ext.pyi) for the native
      # module, but PEP 561 says a type checker must ignore them unless the
      # package is also marked. This is a source-tree check rather than a wheel
      # check because building that wheel needs a full Rust release build;
      # maturin includes the whole `python-source` package directory, so the
      # marker existing here is what puts it in the wheel.
      - name: Assert py.typed is present in the embedded package (PEP 561)
        run: |
          if [ -f embedded/src/surrealdb_embedded/py.typed ]; then
            echo "OK: embedded/src/surrealdb_embedded/py.typed is present"
          else
            echo "ERROR: py.typed is missing, so the _ext.pyi stubs would be ignored by type checkers"
            exit 1
          fi

  # Every other job installs the lockfile, which pins current versions - so
  # nothing here has ever exercised the *declared* minimums. Two of them named
  # versions at which `import surrealdb` raised, and both shipped.
  #
  # Deliberately runs the built wheel out of site-packages with no PYTHONPATH:
  # the point is what a user gets from `pip install surrealdb`, resolved the
  # way a user with old pins would resolve it.
  floors:
    name: Minimum declared dependency versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9
        with:
          version: "latest"
          enable-cache: true

      # The oldest interpreter we support: the one a user still on old pins is
      # most likely to be running, and the one old dependencies have wheels for.
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.10"

      - name: Install surrealdb
        run: curl -sSf https://install.surrealdb.com | sh -s -- --version v3.0.5

      - name: Start surrealdb
        run: surreal start --allow-all -u root -p root --log trace &

      - name: Wait for startup
        run: sleep 5

      - name: Build wheel
        run: uv build --wheel

      # Resolved from pyproject.toml rather than repeated here, so the job
      # cannot drift from what is declared. `lowest-direct` pins our own
      # dependencies to their floors while letting everything they pull in
      # resolve normally - which is what a user with no pins of their own gets,
      # not an artificial combination no resolver would produce.
      - name: Resolve the declared floors
        run: |
          # Explicit, so the resolve cannot silently land on a different
          # interpreter than the one the tests then run under - the markers on
          # some dependencies are keyed to the Python version.
          uv venv --python 3.10 .floors
          uv pip compile --python .floors/bin/python \
            --resolution lowest-direct pyproject.toml -o floor-lock.txt
          echo "Floors under test:"
          grep -vE '^\s*#|^$' floor-lock.txt

      # The lock goes in as a *constraint*, so the test tools resolve normally
      # while every dependency of the SDK is held at its floor.
      - name: Install the wheel at those floors
        run: |
          uv pip install --python .floors/bin/python --constraint floor-lock.txt \
            dist/*.whl pytest pytest-asyncio hypothesis responses coverage
          uv pip list --python .floors/bin/python

      - name: Run unit tests against the floors
        run: .floors/bin/python -m pytest --ignore=tests/unit_tests/connections/embedded
        env:
          PYTHONWARNINGS: ignore::ResourceWarning

  test:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.surrealdb-version == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        surrealdb-version: ["v2.0.5", "v2.1.9", "v2.2.8", "v2.3.10", "v3.0.5", "nightly"]
    name: Core Tests - Python ${{ matrix.python-version }} - SurrealDB ${{ matrix.surrealdb-version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9
        with:
          version: "latest"
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install surrealdb
        run: |
          if [ "${{ matrix.surrealdb-version }}" = "nightly" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://install.surrealdb.com | sh -s -- --nightly
          else
            curl -sSf https://install.surrealdb.com | sh -s -- --version ${{ matrix.surrealdb-version }}
          fi

      - name: Start surrealdb
        run: surreal start --allow-all -u root -p root --log trace &

      - name: Wait for startup
        run: sleep 5

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run unit tests (HTTP)
        run: uv run pytest --ignore=tests/unit_tests/connections/embedded
        env:
          PYTHONPATH: ./src
          SURREALDB_URL: http://localhost:8000
          SURREALDB_VERSION: ${{ matrix.surrealdb-version }}
          PYTHONWARNINGS: ignore::ResourceWarning

      - name: Run unit tests (WebSocket)
        run: uv run pytest --ignore=tests/unit_tests/connections/embedded
        env:
          PYTHONPATH: ./src
          SURREALDB_URL: ws://localhost:8000
          SURREALDB_VERSION: ${{ matrix.surrealdb-version }}
          PYTHONWARNINGS: ignore::ResourceWarning

  test-embedded:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    name: Embedded Tests - Python ${{ matrix.python-version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9
        with:
          version: "latest"
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install dependencies
        run: uv sync --group dev

      - name: Build and install embedded extension
        run: uv run maturin develop --release --manifest-path embedded/Cargo.toml

      - name: Run embedded tests
        run: uv run pytest tests/unit_tests/connections/embedded
        env:
          PYTHONPATH: ./src
          PYTHONWARNINGS: ignore::ResourceWarning
