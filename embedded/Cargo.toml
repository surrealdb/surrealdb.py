[package]
name = "surrealdb-embedded"
version = "3.0.0"
edition = "2021"

[lib]
name = "surrealdb_ext"
path = "src/surrealdb_ext/lib.rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
surrealdb-core = { version = "4", default-features = false, features = [
    "kv-mem",
    "kv-surrealkv",
    "api",
    "cjk-tokenizer",
    "collate",
    "crypto-digest",
    "crypto-password",
    "egraph",
    "encoding",
    "files",
    "fulltext",
    "geo",
    "html-sanitize",
    "maintenance-tasks",
    "regex-unicode",
    "scram",
    "search",
    "text-diff",
    "url",
    "vector-index",
] }
surrealdb-rpc = "4"
surrealdb-types = "4"
tokio = { version = "1", features = ["full"] }
uuid = "1.27"

[profile.release]
lto = true
strip = true
opt-level = 'z'
panic = 'abort'
codegen-units = 1
