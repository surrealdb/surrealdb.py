services:
  # Default service for local development
  surrealdb:
    image: surrealdb/surrealdb:${SURREALDB_VERSION:-v3.0.5}
    command: "start --allow-all"
    environment:
      - SURREAL_USER=root
      - SURREAL_PASS=root
      - SURREAL_INSECURE_FORWARD_ACCESS_ERRORS=true
      - SURREAL_LOG=debug
    ports:
      - "${SURREALDB_PORT:-8000}:8000"
    profiles:
      - default
      - development

  # Service for testing specific v2.x versions
  surrealdb-test:
    image: surrealdb/surrealdb:${TEST_SURREALDB_VERSION:-v2.1.9}
    command: "start --allow-all"
    environment:
      - SURREAL_USER=root
      - SURREAL_PASS=root
      - SURREAL_INSECURE_FORWARD_ACCESS_ERRORS=true
      - SURREAL_LOG=trace
    ports:
      - "${TEST_SURREALDB_PORT:-8001}:8000"
    profiles:
      - test

  # v2.0.x testing
  surrealdb-v2-0:
    image: surrealdb/surrealdb:v2.0.5
    command: "start --allow-all"
    environment:
      - SURREAL_USER=root
      - SURREAL_PASS=root
      - SURREAL_LOG=trace
    ports:
      - "8020:8000"
    profiles:
      - v2-0

  # v2.1.x testing
  surrealdb-v2-1:
    image: surrealdb/surrealdb:v2.1.9
    command: "start --allow-all"
    environment:
      - SURREAL_USER=root
      - SURREAL_PASS=root
      - SURREAL_LOG=trace
    ports:
      - "8021:8000"
    profiles:
      - v2-1

  # v2.2.x testing
  surrealdb-v2-2:
    image: surrealdb/surrealdb:v2.2.8
    command: "start --allow-all"
    environment:
      - SURREAL_USER=root
      - SURREAL_PASS=root
      - SURREAL_LOG=trace
    ports:
      - "8022:8000"
    profiles:
      - v2-2

  # Latest v2.3.x testing
  surrealdb-v2-3:
    image: surrealdb/surrealdb:v2.3.10
    command: "start --allow-all"
    environment:
      - SURREAL_USER=root
      - SURREAL_PASS=root
      - SURREAL_LOG=trace
    ports:
      - "8023:8000"
    profiles:
      - v2-3

  # SurrealDB 3.3.x - the first release that streams query results, so this is
  # what the `query_stream` integration tests need. Point the suite at it with
  # `SURREALDB_PORT=8033 uv run pytest`; against anything older those tests
  # skip themselves.
  surrealdb-v3-3:
    image: surrealdb/surrealdb:${SURREALDB_V3_3_VERSION:-v3.3.0-beta.3}
    command: "start --allow-all"
    environment:
      - SURREAL_USER=root
      - SURREAL_PASS=root
      - SURREAL_INSECURE_FORWARD_ACCESS_ERRORS=true
      - SURREAL_LOG=debug
    ports:
      - "8033:8000"
    profiles:
      - v3-3

  # SurrealDB 3.x (bearer access tests)
  surrealdb-v3:
    image: surrealdb/surrealdb:v3.0.5
    command: "start --allow-all"
    environment:
      - SURREAL_USER=root
      - SURREAL_PASS=root
      - SURREAL_INSECURE_FORWARD_ACCESS_ERRORS=true
      - SURREAL_LOG=debug
    ports:
      - "8030:8000"
    profiles:
      - v3
