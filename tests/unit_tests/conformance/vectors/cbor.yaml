# CBOR value test vectors for SurrealDB.
#
# Every SDK's CBOR codec should pass all of these. spec/README.md explains how
# to consume them; the short version:
#
#   kind: canonical  The server produced `cbor` for `surql`. An SDK MUST decode
#                    `cbor` to `value`, and MUST encode `value` to something that
#                    decodes back to `value`. Encoding to exactly `cbor` is
#                    RECOMMENDED: it is the server's own encoding.
#   kind: decode     Input the server accepts but never produces. An SDK MUST
#                    decode `cbor` to `value`. `canonical` is what the server
#                    sends back for it.
#   kind: reject     Input the server rejects. An SDK's decoder MUST fail on it
#                    too, rather than produce some other value.
#
# The vectors describe the SurrealDB 4.0 wire over plain `cbor`
# (application/cbor). A reject vector with a `legacy` entry is input that
# servers before 4.0 accepted: `legacy.canonical` is what they sent back. An SDK
# MUST NOT send it to any server.
#
# `value` is typed JSON (see conformance/lib/value.ts or spec/README.md).
# `diag` is CBOR diagnostic notation for `cbor`, for reading only. A reject
# vector with `raw: true` is malformed below what diagnostic notation can
# express: its `cbor` is the input and its `diag` is a description.
#
# `cbor`, `diag`, `canonical` and `server` are written by `bun run vectors:write`
# against a live 4.0 server, which also checks every `value` independently;
# `legacy.canonical` and `legacy_server` by the same command against a server
# before 4.0. Edit the
# `surql`, `value` and (for decode and reject vectors) `diag` fields; never edit
# the hex by hand. `bun run vectors:check` re-verifies the file against a server.

version: 1
server: surrealdb-4.0.0-nightly
legacy_server: surrealdb-3.3.4
vectors:
  # --- NONE and NULL -------------------------------------------------------

  - name: none
    kind: canonical
    surql: NONE
    value: { $none: null }
    cbor: c6f6
    diag: 6(null)

  - name: "null"
    kind: canonical
    surql: "NULL"
    value: null
    cbor: f6
    diag: "null"

  - name: none-and-null-in-array
    kind: canonical
    surql: "[NONE, NULL]"
    value: [ { $none: null }, null ]
    cbor: 82c6f6f6
    diag: "[6(null), null]"

  - name: none-and-null-in-object
    kind: canonical
    surql: "{ a: NONE, b: NULL }"
    value: { a: { $none: null }, b: null }
    notes: An object field holding NONE is kept on the wire, distinct from an absent field.
    cbor: a26161c6f66162f6
    diag: '{"a": 6(null), "b": null}'

  # --- bool ----------------------------------------------------------------

  - name: bool-true
    kind: canonical
    surql: "true"
    value: true
    cbor: f5
    diag: "true"

  - name: bool-false
    kind: canonical
    surql: "false"
    value: false
    cbor: f4
    diag: "false"

  # --- int -----------------------------------------------------------------

  - name: int-zero
    kind: canonical
    surql: "0"
    value: 0
    cbor: "00"
    diag: "0"

  - name: int-23
    kind: canonical
    surql: "23"
    value: 23
    cbor: "17"
    diag: "23"

  - name: int-24
    kind: canonical
    surql: "24"
    value: 24
    cbor: "1818"
    diag: "24"

  - name: int-256
    kind: canonical
    surql: "256"
    value: 256
    cbor: "190100"
    diag: "256"

  - name: int-65536
    kind: canonical
    surql: "65536"
    value: 65536
    cbor: 1a00010000
    diag: "65536"

  - name: int-4294967296
    kind: canonical
    surql: "4294967296"
    value: 4294967296
    cbor: 1b0000000100000000
    diag: "4294967296"

  - name: int-negative-one
    kind: canonical
    surql: "-1"
    value: -1
    cbor: "20"
    diag: "-1"

  - name: int-negative-25
    kind: canonical
    surql: "-25"
    value: -25
    cbor: "3818"
    diag: "-25"

  - name: int-max-safe-js
    kind: canonical
    surql: "9007199254740993"
    value: { $int: "9007199254740993" }
    notes: 2^53 + 1. A codec that goes through a double gets 9007199254740992.
    cbor: 1b0020000000000001
    diag: "9007199254740993"

  - name: int-i64-max
    kind: canonical
    surql: "9223372036854775807"
    value: { $int: "9223372036854775807" }
    cbor: 1b7fffffffffffffff
    diag: "9223372036854775807"

  - name: int-i64-min
    kind: canonical
    surql: "-9223372036854775808"
    value: { $int: "-9223372036854775808" }
    cbor: 3b7fffffffffffffff
    diag: "-9223372036854775808"

  # --- float ---------------------------------------------------------------

  - name: float-one
    kind: canonical
    surql: "1.0f"
    value: { $float: 1.0 }
    notes: Half precision. A float with an integral value is still a float.
    cbor: f93c00
    diag: 1.0_1

  - name: float-one-and-a-half
    kind: canonical
    surql: "1.5f"
    value: { $float: 1.5 }
    cbor: f93e00
    diag: 1.5_1

  - name: float-single-precision
    kind: canonical
    surql: "100000.0f"
    value: { $float: 100000.0 }
    cbor: fa47c35000
    diag: 100000.0_2

  - name: float-double-precision
    kind: canonical
    surql: "0.1f"
    value: { $float: 0.1 }
    cbor: fb3fb999999999999a
    diag: 0.1_3

  - name: float-large
    kind: canonical
    surql: "1e300f"
    value: { $float: 1e+300 }
    cbor: fb7e37e43c8800759c
    diag: 1.0e+300_3

  - name: float-negative-zero
    kind: canonical
    surql: "-0.0f"
    value: { $float: "-0" }
    cbor: f98000
    diag: -0.0_1

  - name: float-nan
    kind: canonical
    surql: '<float> "NaN"'
    value: { $float: "NaN" }
    cbor: f97e00
    diag: NaN_1

  - name: float-infinity
    kind: canonical
    surql: math::inf
    value: { $float: "Infinity" }
    cbor: f97c00
    diag: Infinity_1

  - name: float-negative-infinity
    kind: canonical
    surql: -math::inf
    value: { $float: "-Infinity" }
    cbor: f9fc00
    diag: -Infinity_1

  - name: float-double-width-accepted
    kind: decode
    diag: "1.0_3"
    value: { $float: 1.0 }
    notes: Any IEEE 754 width decodes; the server re-encodes in the shortest.
    cbor: fb3ff0000000000000
    canonical: f93c00

  - name: float-single-width-accepted
    kind: decode
    diag: "1.5_2"
    value: { $float: 1.5 }
    cbor: fa3fc00000
    canonical: f93e00

  # --- sized numbers, widened -----------------------------------------------
  # SurrealDB 4.0's sized kinds (i8 to u64, f16, f32) widened, as plain cbor
  # sends them; cbor2.yaml has them tagged. `formats: [cbor]` because cbor.2
  # sends these tagged; `since: "4.0"` because older servers cannot parse the
  # literals.

  - name: sized-i8-widens-to-int
    kind: canonical
    formats: [ cbor ]
    since: "4.0"
    surql: -128i8
    value: -128
    cbor: 387f
    diag: "-128"

  - name: sized-u8-widens-to-int
    kind: canonical
    formats: [ cbor ]
    since: "4.0"
    surql: 255u8
    value: 255
    cbor: 18ff
    diag: "255"

  - name: sized-i16-widens-to-int
    kind: canonical
    formats: [ cbor ]
    since: "4.0"
    surql: -32768i16
    value: -32768
    cbor: 397fff
    diag: "-32768"

  - name: sized-u16-widens-to-int
    kind: canonical
    formats: [ cbor ]
    since: "4.0"
    surql: 65535u16
    value: 65535
    cbor: 19ffff
    diag: "65535"

  - name: sized-i32-widens-to-int
    kind: canonical
    formats: [ cbor ]
    since: "4.0"
    surql: -2147483648i32
    value: -2147483648
    cbor: 3a7fffffff
    diag: "-2147483648"

  - name: sized-u32-widens-to-int
    kind: canonical
    formats: [ cbor ]
    since: "4.0"
    surql: 4294967295u32
    value: 4294967295
    cbor: 1affffffff
    diag: "4294967295"

  - name: sized-u64-widens-to-int
    kind: canonical
    formats: [ cbor ]
    since: "4.0"
    surql: 9223372036854775807u64
    value: { $int: "9223372036854775807" }
    cbor: 1b7fffffffffffffff
    diag: "9223372036854775807"

  - name: sized-u64-past-i64-widens-to-decimal
    kind: canonical
    formats: [ cbor ]
    since: "4.0"
    surql: 18446744073709551615u64
    value: { $decimal: "18446744073709551615" }
    notes: An untagged integer must fit in i64, so plain cbor carries a u64 above i64::MAX as a tag 10 decimal.
    cbor: ca743138343436373434303733373039353531363135
    diag: 10("18446744073709551615")

  - name: sized-f16-widens-to-float
    kind: canonical
    formats: [ cbor ]
    since: "4.0"
    surql: 1.5f16
    value: { $float: 1.5 }
    cbor: f93e00
    diag: 1.5_1

  - name: sized-f32-widens-to-float
    kind: canonical
    formats: [ cbor ]
    since: "4.0"
    surql: 0.1f32
    value: { $float: 0.10000000149011612 }
    notes: The f32 nearest 0.1, as an f64. It needs a single-width float, not a double.
    cbor: fa3dcccccd
    diag: 0.10000000149011612_2

  - name: sized-f32-nan-widens-to-float
    kind: canonical
    formats: [ cbor ]
    since: "4.0"
    surql: <f32>NaN
    value: { $float: "NaN" }
    cbor: f97e00
    diag: NaN_1

  - name: sized-numbers-in-record-id-key-widen
    kind: canonical
    formats: [ cbor ]
    since: "4.0"
    surql: "t:[5u8, 1.5f32]"
    value: { $record: { table: t, key: [ 5, { $float: 1.5 } ] } }
    cbor: c88261748205f93e00
    diag: 8(["t", [5, 1.5_1]])

  # --- decimal -------------------------------------------------------------

  - name: decimal-simple
    kind: canonical
    surql: 1.5dec
    value: { $decimal: "1.5" }
    cbor: ca63312e35
    diag: 10("1.5")

  - name: decimal-zero
    kind: canonical
    surql: 0dec
    value: { $decimal: "0" }
    cbor: ca6130
    diag: 10("0")

  - name: decimal-negative
    kind: canonical
    surql: -1.5dec
    value: { $decimal: "-1.5" }
    cbor: ca642d312e35
    diag: 10("-1.5")

  - name: decimal-max
    kind: canonical
    surql: 79228162514264337593543950335dec
    value: { $decimal: "79228162514264337593543950335" }
    notes: The largest 96-bit decimal. Larger than any i64 and not exact in a double.
    cbor: ca781d3739323238313632353134323634333337353933353433393530333335
    diag: 10("79228162514264337593543950335")

  - name: decimal-smallest-scale
    kind: canonical
    surql: 0.0000000000000000000000000001dec
    value: { $decimal: "0.0000000000000000000000000001" }
    cbor: ca781e302e30303030303030303030303030303030303030303030303030303031
    diag: 10("0.0000000000000000000000000001")

  - name: decimal-28-digits
    kind: canonical
    surql: 3.141592653589793238462643383dec
    value: { $decimal: "3.141592653589793238462643383" }
    cbor: ca781d332e313431353932363533353839373933323338343632363433333833
    diag: 10("3.141592653589793238462643383")

  - name: decimal-large-with-fraction
    kind: canonical
    surql: 12345678901234567890.123456789dec
    value: { $decimal: "12345678901234567890.123456789" }
    cbor: ca781e31323334353637383930313233343536373839302e313233343536373839
    diag: 10("12345678901234567890.123456789")

  - name: decimal-trailing-zeros-normalised
    kind: decode
    diag: '10("1.50")'
    value: { $decimal: "1.5" }
    notes: The server normalises trailing zeros away on decode.
    cbor: ca64312e3530
    canonical: ca63312e35

  # --- string --------------------------------------------------------------

  - name: string-empty
    kind: canonical
    surql: "''"
    value: ""
    cbor: "60"
    diag: '""'

  - name: string-ascii
    kind: canonical
    surql: "'hello'"
    value: hello
    cbor: 6568656c6c6f
    diag: '"hello"'

  - name: string-unicode
    kind: canonical
    surql: "'héllo ☃ 🦀'"
    value: "héllo ☃ 🦀"
    cbor: 6f68c3a96c6c6f20e2988320f09fa680
    diag: '"héllo ☃ 🦀"'

  - name: string-looks-like-record-id
    kind: canonical
    surql: "'person:alice'"
    value: "person:alice"
    notes: >
      A plain string, never a record id. (The JSON wire coerces such strings; CBOR does not.)
    cbor: 6c706572736f6e3a616c696365
    diag: '"person:alice"'

  - name: string-looks-like-datetime
    kind: canonical
    surql: "'2024-01-01T00:00:00Z'"
    value: "2024-01-01T00:00:00Z"
    cbor: 74323032342d30312d30315430303a30303a30305a
    diag: '"2024-01-01T00:00:00Z"'

  # --- bytes ---------------------------------------------------------------

  - name: bytes-empty
    kind: canonical
    surql: <bytes> ""
    value: { $bytes: "" }
    cbor: "40"
    diag: h''

  - name: bytes-hello
    kind: canonical
    surql: <bytes> "hello"
    value: { $bytes: "68656c6c6f" }
    cbor: 4568656c6c6f
    diag: h'68656c6c6f'

  # --- uuid ----------------------------------------------------------------

  - name: uuid-v7
    kind: canonical
    surql: u"0189e0a5-1c3d-7abc-8def-0123456789ab"
    value: { $uuid: "0189e0a5-1c3d-7abc-8def-0123456789ab" }
    cbor: d825500189e0a51c3d7abc8def0123456789ab
    diag: 37(h'0189e0a51c3d7abc8def0123456789ab')

  - name: uuid-nil
    kind: canonical
    surql: u"00000000-0000-0000-0000-000000000000"
    value: { $uuid: "00000000-0000-0000-0000-000000000000" }
    cbor: d8255000000000000000000000000000000000
    diag: 37(h'00000000000000000000000000000000')

  - name: uuid-max
    kind: canonical
    surql: u"ffffffff-ffff-ffff-ffff-ffffffffffff"
    value: { $uuid: "ffffffff-ffff-ffff-ffff-ffffffffffff" }
    cbor: d82550ffffffffffffffffffffffffffffffff
    diag: 37(h'ffffffffffffffffffffffffffffffff')

  - name: reject-uuid-string-tag-9
    kind: reject
    diag: '9("0189e0a5-1c3d-7abc-8def-0123456789ab")'
    notes: Tag 9 is refused from 4.0 on; send tag 37, which every server since 1.5.0 reads. Servers before 4.0 accepted it; `legacy.canonical` is what they returned.
    legacy:
      canonical: d825500189e0a51c3d7abc8def0123456789ab
    cbor: c9782430313839653061352d316333642d376162632d386465662d303132333435363738396162

  # --- datetime ------------------------------------------------------------

  - name: datetime-epoch
    kind: canonical
    surql: d"1970-01-01T00:00:00Z"
    value: { $datetime: "1970-01-01T00:00:00Z" }
    cbor: cc820000
    diag: 12([0, 0])

  - name: datetime-nanosecond-precision
    kind: canonical
    surql: d"2024-02-29T12:34:56.123456789Z"
    value: { $datetime: "2024-02-29T12:34:56.123456789Z" }
    cbor: cc821a65e079f01a075bcd15
    diag: 12([1709210096, 123456789])

  - name: datetime-one-nanosecond-after-epoch
    kind: canonical
    surql: d"1970-01-01T00:00:00.000000001Z"
    value: { $datetime: "1970-01-01T00:00:00.000000001Z" }
    cbor: cc820001
    diag: 12([0, 1])

  - name: datetime-pre-epoch-half-second
    kind: canonical
    surql: d"1969-12-31T23:59:59.5Z"
    value: { $datetime: "1969-12-31T23:59:59.500000000Z" }
    notes: "Negative seconds, positive nanoseconds: [-1, 500000000]."
    cbor: cc82201a1dcd6500
    diag: 12([-1, 500000000])

  - name: datetime-pre-epoch-last-nanosecond
    kind: canonical
    surql: d"1969-12-31T23:59:59.999999999Z"
    value: { $datetime: "1969-12-31T23:59:59.999999999Z" }
    cbor: cc82201a3b9ac9ff
    diag: 12([-1, 999999999])

  - name: datetime-1900
    kind: canonical
    surql: d"1900-01-01T00:00:00Z"
    value: { $datetime: "1900-01-01T00:00:00Z" }
    cbor: cc823a83aa7e7f00
    diag: 12([-2208988800, 0])

  - name: datetime-year-one
    kind: canonical
    surql: d"0001-01-01T00:00:00Z"
    value: { $datetime: "0001-01-01T00:00:00Z" }
    cbor: cc823b0000000e7791f6ff00
    diag: 12([-62135596800, 0])

  - name: datetime-year-9999
    kind: canonical
    surql: d"9999-12-31T23:59:59.999999999Z"
    value: { $datetime: "9999-12-31T23:59:59.999999999Z" }
    cbor: cc821b0000003afff4417f1a3b9ac9ff
    diag: 12([253402300799, 999999999])

  - name: datetime-offset-normalised-to-utc
    kind: canonical
    surql: d"2024-01-01T01:00:00+01:00"
    value: { $datetime: "2024-01-01T00:00:00Z" }
    notes: The wire carries an instant; the offset is not preserved.
    cbor: cc821a6592008000
    diag: 12([1704067200, 0])

  - name: reject-datetime-string-tag-0
    kind: reject
    diag: '0("2024-02-29T12:34:56.123456789Z")'
    notes: Tag 0 is refused from 4.0 on; send tag 12, which every server since 1.5.0 reads. Servers before 4.0 accepted it; `legacy.canonical` is what they returned.
    legacy:
      canonical: cc821a65e079f01a075bcd15
    cbor: c0781e323032342d30322d32395431323a33343a35362e3132333435363738395a

  - name: datetime-pre-epoch-decoded
    kind: decode
    diag: "12([-1, 0])"
    value: { $datetime: "1969-12-31T23:59:59Z" }
    cbor: cc822000
    canonical: cc822000

  # --- duration ------------------------------------------------------------

  - name: duration-zero
    kind: canonical
    surql: 0s
    value: { $duration: [ 0, 0 ] }
    notes: The empty array.
    cbor: ce80
    diag: 14([])

  - name: duration-whole-seconds
    kind: canonical
    surql: 1h30m
    value: { $duration: [ 5400, 0 ] }
    cbor: ce81191518
    diag: 14([5400])

  - name: duration-one-nanosecond
    kind: canonical
    surql: 1ns
    value: { $duration: [ 0, 1 ] }
    cbor: ce820001
    diag: 14([0, 1])

  - name: duration-seconds-and-nanoseconds
    kind: canonical
    surql: 1s500ms
    value: { $duration: [ 1, 500000000 ] }
    cbor: ce82011a1dcd6500
    diag: 14([1, 500000000])

  - name: duration-nanosecond-precision
    kind: canonical
    surql: 1d1ns
    value: { $duration: [ 86400, 1 ] }
    cbor: ce821a0001518001
    diag: 14([86400, 1])

  - name: duration-u64-seconds
    kind: canonical
    surql: 18446744073709551615s
    value: { $duration: [ "18446744073709551615", 0 ] }
    notes: Seconds are u64. Larger than i64, so a signed decoder overflows here.
    cbor: ce811bffffffffffffffff
    diag: 14([18446744073709551615])

  - name: reject-duration-string-tag-13
    kind: reject
    diag: '13("1h30m")'
    notes: Tag 13 is refused from 4.0 on; send tag 14, which every server since 1.5.0 reads. Servers before 4.0 accepted it; `legacy.canonical` is what they returned.
    legacy:
      canonical: ce81191518
    cbor: cd65316833306d

  - name: duration-nanoseconds-only-pair
    kind: decode
    diag: "14([0, 0])"
    value: { $duration: [ 0, 0 ] }
    notes: Non-shortest forms are accepted.
    cbor: ce820000
    canonical: ce80

  # --- array and object ----------------------------------------------------

  - name: array-empty
    kind: canonical
    surql: "[]"
    value: []
    cbor: "80"
    diag: "[]"

  - name: array-mixed
    kind: canonical
    surql: "[1, 'a', true, NULL, [2]]"
    value: [ 1, "a", true, null, [ 2 ] ]
    cbor: 85016161f5f68102
    diag: '[1, "a", true, null, [2]]'

  - name: array-indefinite-length
    kind: decode
    diag: '[_ 1, "a"]'
    value: [ 1, "a" ]
    cbor: 9f016161ff
    canonical: "82016161"

  - name: object-empty
    kind: canonical
    surql: "{}"
    value: {}
    cbor: a0
    diag: "{}"

  - name: object-keys-sorted
    kind: canonical
    surql: "{ b: 1, a: 2 }"
    value: { a: 2, b: 1 }
    notes: The server emits object keys in sorted order.
    cbor: a2616102616201
    diag: '{"a": 2, "b": 1}'

  - name: object-nested
    kind: canonical
    surql: "{ a: { b: [1, { c: 'd' }] } }"
    value: { a: { b: [ 1, { c: d } ] } }
    cbor: a16161a161628201a161636164
    diag: '{"a": {"b": [1, {"c": "d"}]}}'

  - name: object-looks-like-typed-json
    kind: canonical
    surql: "{ '$none': 1 }"
    value: { $object: { $none: 1 } }
    notes: Only here to pin the typed-JSON escape; on the wire it is a plain map.
    cbor: a165246e6f6e6501
    diag: '{"$none": 1}'

  - name: object-indefinite-length
    kind: decode
    diag: '{_ "a": 1}'
    value: { a: 1 }
    cbor: bf616101ff
    canonical: a1616101

  # --- set -----------------------------------------------------------------

  - name: set-empty
    kind: canonical
    surql: <set> []
    value: { $set: [] }
    cbor: d83880
    diag: 56([])

  - name: set-sorted-and-deduplicated
    kind: canonical
    surql: <set> [3, 1, 2, 1]
    value: { $set: [ 1, 2, 3 ] }
    cbor: d83883010203
    diag: 56([1, 2, 3])

  - name: set-mixed
    kind: canonical
    surql: "<set> ['b', 1, 'a']"
    value: { $set: [ 1, "a", "b" ] }
    cbor: d838830161616162
    diag: 56([1, "a", "b"])

  - name: set-unsorted-input
    kind: decode
    diag: "56([3, 1, 2, 1])"
    value: { $set: [ 1, 2, 3 ] }
    notes: The server sorts and deduplicates whatever it receives.
